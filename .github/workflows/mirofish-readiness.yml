name: Romo7 MiroFish model-free readiness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mirofish-readiness.yml"
      - "experiments/mirofish/**"

permissions:
  contents: read

concurrency:
  group: mirofish-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned official Codex CLI (no credentials or inference)
        run: |
          npm install --prefix "$RUNNER_TEMP/mirofish-codex" --no-audit --no-fund @openai/codex@0.130.0
          echo "$RUNNER_TEMP/mirofish-codex/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify bounded public experiment input
        run: |
          python - <<'PY'
          from pathlib import Path
          seed = Path("experiments/mirofish/romo7-brief.md").read_text(encoding="utf-8")
          assert all(f"**{x} —" in seed for x in "ABC"), "Three offer definitions missing"
          assert all(f"P{i}:" in seed for i in range(1,7)), "Six synthetic personas missing"
          assert "not observed buyers" in seed.lower() and "BLOCKED_MODEL" in seed
          assert "Do not run test attacks" in seed
          print("SEED_VALID: 3 offers, 6 fictional roles, <=10 rounds, no real-client data")
          PY

      - name: Checkout pinned upstream MiroFish CLI fork
        run: |
          git clone -q https://github.com/GianniDerieuw/mirofish.git mirofish-upstream
          cd mirofish-upstream
          git checkout -q 3e98e776cdfc9556c12ace82a60e9d3da5bd41e7
          test "$(git rev-parse HEAD)" = "3e98e776cdfc9556c12ace82a60e9d3da5bd41e7"
          python -m compileall -q app
          echo "FORK_PINNED_AND_COMPILED=$(git rev-parse --short HEAD)"

      - name: Test experimental Ollama adapter (HTTP fixtures, no live model)
        run: python experiments/mirofish/ollama/test_adapter.py mirofish-upstream

      - name: Correct and test upstream doctor executable lookup
        run: |
          python - <<'PY'
          import ast
          import shutil
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import patch
          cli = Path("mirofish-upstream/app/cli.py")
          source = cli.read_text(encoding="utf-8")
          old = "return shutil.which(provider) is not None"
          new = 'return shutil.which({"codex-cli": "codex", "claude-cli": "claude"}[provider]) is not None'
          assert source.count(old) == 1, "Pinned upstream doctor changed; review compatibility patch"
          source = source.replace(old, new)
          cli.write_text(source, encoding="utf-8")
          tree = ast.parse(source)
          fn = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "cmd_doctor")
          module = ast.fix_missing_locations(ast.Module(body=[fn], type_ignores=[]))
          # Execute the actual patched function with only its lightweight helpers.
          import runpy
          helpers = runpy.run_path("mirofish-upstream/app/_agent_cli.py")
          import os, sys
          for provider, binary in (("codex-cli", "codex"), ("claude-cli", "claude")):
              ns = dict(os=os, sys=sys, shutil=shutil, __file__=str(cli.resolve()),
                        Config=SimpleNamespace(LLM_PROVIDER=provider),
                        DoctorCheck=helpers["DoctorCheck"], doctor_runner=helpers["doctor_runner"])
              exec(compile(module, str(cli), "exec"), ns)
              with patch.dict(os.environ, {"LLM_PROVIDER": provider}):
                  with patch.object(shutil, "which", side_effect=lambda name: "/test/" + binary if name == binary else None):
                      assert ns["cmd_doctor"]() == 0, provider + " actual executable was not detected"
                  with patch.object(shutil, "which", return_value=None):
                      assert ns["cmd_doctor"]() == 1, provider + " missing executable did not fail"
          print("DOCTOR_LOOKUP_TESTS_PASS: 2 providers x present/missing; no model called")
          PY
          python -m compileall -q mirofish-upstream/app

      - name: Install pinned fork dependencies (no model credentials or billable endpoints)
        working-directory: mirofish-upstream
        run: uv sync --frozen

      - name: Exercise actual MiroFish CLI and report exact model-access gate
        working-directory: mirofish-upstream
        env:
          LLM_PROVIDER: codex-cli
          NO_COLOR: "1"
        run: |
          mkdir -p ../experiments/mirofish/evidence
          uv run --no-sync mirofish --help > ../experiments/mirofish/evidence/cli-help.txt
          python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" > ../experiments/mirofish/evidence/version.txt
          uv run --no-sync mirofish runs list --json > ../experiments/mirofish/evidence/runs-list.json
          set +e
          uv run --no-sync mirofish doctor > ../experiments/mirofish/evidence/doctor.txt 2>&1
          doctor_exit=$?
          set -e
          echo "Doctor exit code: $doctor_exit"
          cat ../experiments/mirofish/evidence/doctor.txt
          export MIROFISH_DOCTOR_EXIT="$doctor_exit"
          python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          doctor_exit = int(os.environ["MIROFISH_DOCTOR_EXIT"])
          assert doctor_exit == 0, "Installed Codex executable must pass the corrected doctor"
          assert shutil.which("codex"), "Official Codex executable missing"
          version = subprocess.run(["codex", "--version"], capture_output=True, text=True, timeout=20, check=True).stdout.strip()
          assert "0.130.0" in version, "Codex pin mismatch"
          # Status only: never start login, transfer credentials, or request inference.
          status = subprocess.run(["codex", "login", "status"], capture_output=True, text=True, timeout=20)
          if status.returncode not in (0, 1):
              raise RuntimeError("Codex login status command failed unexpectedly")
          authenticated = status.returncode == 0
          manifest = {
              "engine": "GianniDerieuw/mirofish",
              "ref": "3e98e776cdfc9556c12ace82a60e9d3da5bd41e7",
              "codex_version": version,
              "doctor_exit_code": doctor_exit,
              "doctor_executable_lookup_corrected": True,
              "login_status_exit_code": status.returncode,
              "stored_authentication_detected": authenticated,
              "model_access_verified": False,
              "real_simulation_completed": False,
              "rounds_executed": 0, "llm_calls": 0, "new_paid_api_charges": 0,
              "docker_or_llm_credentials_supplied": False,
              "gate": "BLOCKED_UNVERIFIED_MODEL" if authenticated else "BLOCKED_AUTH",
              "reason": "No authorized model response verified; model-free workflow never performs inference."
          }
          evidence = Path("../experiments/mirofish/evidence")
          (evidence / "codex-version.txt").write_text(version + "\n", encoding="utf-8")
          (evidence / "run-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("CODEX_EXECUTABLE_VERIFIED; gate=" + manifest["gate"] + "; model_calls=0")
          PY
          test -s ../experiments/mirofish/evidence/cli-help.txt
          test -s ../experiments/mirofish/evidence/runs-list.json
          test -s ../experiments/mirofish/evidence/run-manifest.json
          echo "CLI_SMOKE_PASS; REAL_SIMULATION_BLOCKED_MODEL (intentional zero-spend gate)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirofish-romo7-readiness
          path: experiments/mirofish/evidence/
          if-no-files-found: warn
          retention-days: 7
